name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud Storage
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_CREDENTIALS:-}" ]; then
            echo "Missing required GitHub secret: CLOUD_CREDENTIALS" >&2
            exit 1
          fi
          CREDENTIAL_PATH="$RUNNER_TEMP/sa-key.json"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "sa-key.json"
          path.write_text(os.environ["CLOUD_CREDENTIALS"], encoding="utf-8")
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_PATH" >> "$GITHUB_ENV"

      - name: Configure DVC credential path
        run: |
          set -euo pipefail
          dvc remote modify --local myremote credentialpath "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Pull training data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          set -euo pipefail
          ACCURACY=$(python -c "import json; print(json.load(open('outputs/metrics.json', encoding='utf-8'))['accuracy'])")
          echo "accuracy=$ACCURACY" >> "$GITHUB_OUTPUT"
          echo "Model accuracy: $ACCURACY"

      - name: Upload model to Google Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_BUCKET:-}" ]; then
            echo "Missing required GitHub secret: CLOUD_BUCKET" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Uploaded model to gs://{bucket_name}/models/latest/model.pkl")
          PY

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json
          if-no-files-found: error

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'PY'
          import os

          threshold = 0.70
          raw_accuracy = os.environ.get("ACCURACY", "").strip()
          if not raw_accuracy:
              raise SystemExit("FAILED: missing accuracy output from Train job.")

          accuracy = float(raw_accuracy)
          if accuracy < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {accuracy:.4f} < {threshold:.2f}. Deploy blocked."
              )

          print(f"PASSED: accuracy {accuracy:.4f} >= {threshold:.2f}.")
          PY

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart mlops-serve

            for attempt in 1 2 3 4 5 6; do
              if curl -fsS http://localhost:8000/health; then
                echo
                echo "Health check passed on attempt ${attempt}."
                exit 0
              fi
              echo "Health check attempt ${attempt} failed; retrying in 5 seconds..."
              sleep 5
            done

            echo "Service failed health check after deployment." >&2
            sudo journalctl -u mlops-serve -n 50 --no-pager || true
            exit 1
