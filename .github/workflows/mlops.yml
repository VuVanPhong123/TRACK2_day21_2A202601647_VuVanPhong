name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
  GCP_PROJECT_ID: track2-day16-2a202601647
  GCP_SERVICE_ACCOUNT: track2-day21-mlops-sa@track2-day16-2a202601647.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/127452559814/locations/global/workloadIdentityPools/track2-day21-github-pool/providers/track2-day21-github
  EVAL_THRESHOLD: "0.68"

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configure DVC credential path
        run: |
          set -euo pipefail
          dvc remote modify --local myremote credentialpath "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Pull training data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          set -euo pipefail
          ACCURACY=$(python -c "import json; print(json.load(open('outputs/metrics.json', encoding='utf-8'))['accuracy'])")
          echo "accuracy=$ACCURACY" >> "$GITHUB_OUTPUT"
          echo "Model accuracy: $ACCURACY"

      - name: Upload candidate model artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: |
            models/model.pkl
            outputs/metrics.json
          if-no-files-found: error
          retention-days: 7

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'PY'
          import os

          threshold = float(os.environ["EVAL_THRESHOLD"])
          raw_accuracy = os.environ.get("ACCURACY", "").strip()
          if not raw_accuracy:
              raise SystemExit("FAILED: missing accuracy output from Train job.")

          accuracy = float(raw_accuracy)
          if accuracy < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {accuracy:.4f} < {threshold:.2f}. Deploy blocked."
              )

          print(f"PASSED: accuracy {accuracy:.4f} >= {threshold:.2f}.")
          PY

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Download candidate model artifact
        uses: actions/download-artifact@v4
        with:
          name: candidate-model

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Promote the passing candidate to latest
        run: |
          set -euo pipefail
          test -n "${CLOUD_BUCKET:-}"
          gcloud storage cp models/model.pkl "gs://${CLOUD_BUCKET}/models/latest/model.pkl"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart mlops-serve

            for attempt in 1 2 3 4 5 6; do
              if curl -fsS http://localhost:8000/health; then
                echo
                echo "Health check passed on attempt ${attempt}."
                exit 0
              fi
              echo "Health check attempt ${attempt} failed; retrying in 5 seconds..."
              sleep 5
            done

            echo "Service failed health check after deployment." >&2
            sudo journalctl -u mlops-serve -n 50 --no-pager || true
            exit 1
